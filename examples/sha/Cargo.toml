[package]
name = "sha"
version = "0.12.0"
edition = "2021"

[dependencies]
borsh = "1.6.0"
clap = { version = "4.0", features = ["derive"] }
hex = "0.4"
risc0-zkvm = { path = "../../risc0/zkvm" }
sha-methods = { path = "methods" }

[dev-dependencies]
hex = "0.4"

[features]
cuda = ["risc0-zkvm/cuda"]
default = []
prove = ["risc0-zkvm/prove"]
